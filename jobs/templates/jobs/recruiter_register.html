<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Registration | SmartHire AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f4ff;
            margin: 0;
            padding: 30px 15px;
            color: #243b64;
        }

        .container {
            max-width: 460px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 5px 20px #d7deef;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #667085;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd3e0;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2457c5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #193f96;
        }

        .messages {
            color: #c62828;
            margin-bottom: 15px;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #2457c5;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>SmartHire AI</h1>
    <p class="subtitle">Create your Recruiter Account</p>

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label for="username">Username *</label>
        <input
            type="text"
            id="username"
            name="username"
            required
        >

        <label for="email">Email *</label>
        <input
            type="email"
            id="email"
            name="email"
            required
        >

        <label for="company_name">Company Name *</label>
        <input
            type="text"
            id="company_name"
            name="company_name"
            required
        >

        <label for="phone">Phone Number</label>
        <input
            type="tel"
            id="phone"
            name="phone"
        >

        <label for="password">Password *</label>
        <input
            type="password"
            id="password"
            name="password"
            minlength="8"
            required
        >

        <label for="confirm_password">Confirm Password *</label>
        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            minlength="8"
            required
        >

        <button type="submit">Create Recruiter Account</button>
    </form>

    <div class="links">
        <p>Already registered?
            <a href="{% url 'recruiter_login' %}">Login here</a>
        </p>

        <a href="/">Back to Home</a>
    </div>
</div>

</body>
</html>
