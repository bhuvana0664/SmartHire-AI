<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job | SmartHire AI</title>

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #f0f4ff;
            color: #243b64;
            margin: 0;
            padding: 25px 15px;
        }

        .container {
            max-width: 650px;
            margin: 25px auto;
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 16px #d7deef;
        }

        h1 { text-align: center; }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd3e0;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2457c5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .messages { color: #c62828; }

        a {
            color: #2457c5;
            text-decoration: none;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>Post a New Job</h1>
    <p>Company: {{ request.user.recruiter_profile.company_name }}</p>

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label for="title">Job Title *</label>
        <input id="title" name="title" type="text" required>

        <label for="location">Job Location *</label>
        <input id="location" name="location" type="text" required>

        <label for="salary">Salary *</label>
        <input id="salary" name="salary" type="text"
               placeholder="e.g. ₹20,000 per month" required>

        <label for="description">Job Description *</label>
        <textarea id="description" name="description" required></textarea>

        <label for="requirements">Requirements *</label>
        <textarea id="requirements" name="requirements" required></textarea>

        <button type="submit">Publish Job</button>
    </form>

    <p><a href="{% url 'recruiter_dashboard' %}">Back to Dashboard</a></p>
</div>
</body>
</html>
