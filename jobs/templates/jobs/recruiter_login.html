<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Login | SmartHire AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f4ff;
            margin: 0;
            padding: 30px 15px;
            color: #243b64;
        }

        .container {
            max-width: 420px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 5px 20px #d7deef;
        }

        h1, .subtitle {
            text-align: center;
        }

        .subtitle {
            color: #667085;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd3e0;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2457c5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .messages {
            color: #c62828;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #2457c5;
            text-decoration: none;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>SmartHire AI</h1>
    <p class="subtitle">Recruiter Login</p>

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Login</button>
    </form>

    <div class="links">
        <p>New recruiter?
            <a href="{% url 'recruiter_register' %}">Create Account</a>
        </p>
        <p><a href="/">Back to Home</a></p>
    </div>
</div>
</body>
</html>
